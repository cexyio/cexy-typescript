name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read

# The cexy-api-spec commit the spec and conformance tests run against. Pinned so that a spec
# change cannot silently change what CI tests; bump it in a reviewed PR.
env:
  SPEC_COMMIT: cf6e70ec21b73a02d3066b5aade796e78b904c82

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: cexy-typescript}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-typescript, persist-credentials: false}
      # The shared spec and conformance cases live in cexy-api-spec, checked out next to this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: cexyio/cexy-api-spec, ref: "${{ env.SPEC_COMMIT }}", path: cexy-api-spec, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 22, cache: npm, cache-dependency-path: cexy-typescript/package-lock.json}
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Generated types match the spec (drift check)
        run: npm run generate:check
      - name: Build
        run: npm run build
      - name: Package contents
        run: npm pack --dry-run
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: No internal references
        env:
          SCAN_PATTERNS: ${{ secrets.SCAN_PATTERNS }}
        run: |
          printf '%s\n' "$SCAN_PATTERNS" > "$RUNNER_TEMP/scan-patterns.txt"
          CEXY_SCAN_PATTERNS_FILE="$RUNNER_TEMP/scan-patterns.txt" python3 tools/scan_internal.py .
      - name: Secret scan (gitleaks 8.21.2, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run: {working-directory: cexy-typescript}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-typescript, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: cexyio/cexy-api-spec, ref: "${{ env.SPEC_COMMIT }}", path: cexy-api-spec, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "${{ matrix.node }}", cache: npm, cache-dependency-path: cexy-typescript/package-lock.json}
      - run: npm ci
      - name: Unit, conformance and WebSocket tests (offline)
        run: npm test
      - name: Built package loads (ESM + CJS)
        run: |
          npm run build
          node -e "const c=require('./dist/index.cjs'); if(!c.CexyClient) process.exit(1)"
          node --input-type=module -e "import {CexyClient} from './dist/index.js'; if(!CexyClient) process.exit(1)"

  # CexyQA rule (2026-09-27): build the package exactly as users get it and use it from an empty
  # project without dev dependencies, so a dev dependency can never mask a broken runtime path.
  consumer:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: cexy-typescript}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-typescript, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 22, cache: npm, cache-dependency-path: cexy-typescript/package-lock.json}
      - run: npm ci
      - name: Packed tarball installs into an empty project (ESM + CJS smoke, offline)
        run: bash ci/consumer/run.sh
