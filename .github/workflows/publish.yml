name: publish
# Tag-triggered npm release with trusted publishing (OIDC) and provenance. No NPM_TOKEN or other
# long-lived secret: configure this repository, this workflow and the `npm` environment as a
# trusted publisher for @cexyio/cexy on npmjs.com.
#
# Two jobs: `build` (no OIDC token) verifies the tag, tests, builds and packs; `publish` (OIDC
# only, protected `npm` environment) publishes exactly that tarball and does nothing else.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
env:
  # The cexy-api-spec commit the spec and conformance tests run against. Pinned so that a spec
  # change cannot silently change what CI tests; bump it in a reviewed PR.
  SPEC_COMMIT: dd57dccc09be628282b116f572017822b0a50005
  # One definition of the publish command, used verbatim by the build job's dry run and by the
  # publish job, both from $GITHUB_WORKSPACE with the tarball in ./pkg. PUBLISH_ARGS is expanded
  # unquoted on purpose (word splitting and the glob). "./" matters: npm reads "pkg/x.tgz" as
  # a GitHub user/repo shorthand, not a file.
  NPM_CLI: npm@11.6.2
  PUBLISH_ARGS: ./pkg/*.tgz --access public --ignore-scripts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run: {working-directory: cexy-typescript}
    outputs:
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-typescript, fetch-depth: 0, persist-credentials: false}
      - name: Refuse tags whose commit is not on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: cexyio/cexy-api-spec, ref: "${{ env.SPEC_COMMIT }}", path: cexy-api-spec, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 22}
      - name: Tag matches package.json version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          case "$VERSION" in *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;; *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;; esac
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run generate:check
      - run: npm test
      - name: No internal references
        env:
          SCAN_PATTERNS: ${{ secrets.SCAN_PATTERNS }}
        run: |
          printf '%s\n' "$SCAN_PATTERNS" > "$RUNNER_TEMP/scan-patterns.txt"
          CEXY_SCAN_PATTERNS_FILE="$RUNNER_TEMP/scan-patterns.txt" python3 tools/scan_internal.py .
      - name: Packed tarball installs into an empty project (ESM + CJS smoke, offline)
        run: bash ci/consumer/run.sh
      - run: npm run build
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          ls -l "$RUNNER_TEMP/pkg"
          # Printed so a manually published tarball can be checked against what CI built
          # (the artifact digest covers the zip, not the tgz).
          (cd "$RUNNER_TEMP/pkg" && sha256sum *.tgz | sed 's/^/tarball sha256 /')
      - name: Dry-run the publish command (same command, same directory as the publish job; no upload)
        working-directory: ${{ github.workspace }}
        env:
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          mkdir -p pkg && cp "$RUNNER_TEMP"/pkg/*.tgz pkg/
          # shellcheck disable=SC2086
          npx -y "$NPM_CLI" publish $PUBLISH_ARGS --tag "$DIST_TAG" --provenance=false --dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: npm-package, path: pkg}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 22, registry-url: "https://registry.npmjs.org"}
      # npm >= 11.5.1 is required for trusted publishing (OIDC); pinned, not "latest".
      - name: Publish the tarball built above
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          # shellcheck disable=SC2086
          npx -y "$NPM_CLI" publish $PUBLISH_ARGS --tag "$DIST_TAG" --provenance
