repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: scan-internal
        name: scan for internal references
        entry: python3 tools/scan_internal.py
        language: system
        pass_filenames: false
      - id: lint
        name: eslint
        entry: npm run -s lint
        language: system
        pass_filenames: false
        types_or: [ts, javascript]
      - id: typecheck
        name: tsc --noEmit
        entry: npm run -s typecheck
        language: system
        pass_filenames: false
        types_or: [ts]
